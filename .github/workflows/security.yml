name: Security

# Backstop, not the gate. .githooks/pre-push is the gate -- it runs before the
# commits leave this machine, which is the last point where a secret can still be
# stopped. By the time this job runs, anything it finds is already pushed and the
# only remaining fix is rewriting history.
#
# It earns its place by catching what gets in around the hook: a push made with
# --no-verify, or from a clone where nobody ran `git config core.hooksPath .githooks`.
#
# Same scanner as the hook, so local and CI cannot disagree about what a secret is.
# GITLEAKS_VERSION here and in scripts/secret_scan.sh move together.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: the push hook only scans what each push adds.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        # PyYAML, for the pipeline scan to read this workflow.
        run: pip install -r requirements.txt

      - name: Install zsh
        # The shell config tests run zsh; ubuntu-latest doesn't ship it.
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: Install gitleaks
        # The secret-gate tests run the real scanner, at the version the script pins.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Run tests
        # The guard engine's tests are pure Python and need nothing else running.
        run: python3 -m unittest discover tests/
