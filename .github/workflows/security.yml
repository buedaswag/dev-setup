name: Security

# Backstop, not the gate. .githooks/pre-commit is the gate -- it runs before the
# commit exists, which is the only point where a secret can still be stopped.
# By the time this job runs, anything it finds is already pushed and the only
# remaining fix is rewriting history.
#
# It earns its place by catching what gets in around the hook: a commit made with
# --no-verify, or from a clone where nobody ran `git config core.hooksPath .githooks`.
#
# Same scanner as the hook, so local and CI cannot disagree about what a secret is.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: the hook scans the work tree, so history is exactly the
          # part it never sees.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        # PyYAML, for the pipeline scan to read this workflow.
        run: pip install -r requirements.txt

      - name: Run tests
        # The guard engine's tests are pure Python and need nothing else running.
        # The secret-gate tests need Docker, which this runner has.
        run: python3 -m unittest discover tests/
